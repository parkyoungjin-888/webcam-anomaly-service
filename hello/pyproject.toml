[project]
name = "hello"
version = "0.1.0"
description = "pipeline verification dummy service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

# 이 서비스는 라이브러리가 아니라 애플리케이션이다.
# package = false 로 두면 uv 가 자기 자신을 빌드/설치하지 않고 의존성만 관리한다.
[tool.uv]
package = false

# CI 의 테스트 게이트에서만 쓰는 의존성.
# Dockerfile 은 uv sync --no-dev 라 이미지에 들어가지 않는다.
[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
# 원칙은 "한 줄로 쓸 수 있으면 한 줄로". 140 은 상한이지 목표가 아니다.
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "N", "UP", "B", "SIM", "COM", "Q", "ASYNC", "RUF"]
ignore = [
    "COM812",  # trailing comma 를 붙이라는 규칙 — 컨벤션은 반대로 금지한다
]

# 켜지 않는 것과 이유:
#   D      docstring 을 강제한다. 컨벤션은 docstring 대신 함수 위 주석을 쓴다.
#   ANN    모든 인자에 타입 힌트를 강제한다. 과도하다.
#   G004   f-string 로깅을 금지한다. 컨벤션은 단순 메시지에 f-string 을 허용한다.
#   TRY401 logger.exception 의 str(e) 를 중복이라 본다. 컨벤션은 이유를 들어 권장한다.
# ruff format 도 쓰지 않는다 — compact 스타일을 expanded 로 바꾸고 따옴표를 뒤집는다.

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py 가 리포지토리 루트에 있으므로 sys.path 에 넣어준다.
pythonpath = ["."]
