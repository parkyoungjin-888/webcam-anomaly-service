[project]
name = "hello"
version = "0.1.0"
description = "pipeline verification dummy service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

# 이 서비스는 라이브러리가 아니라 애플리케이션이다.
# package = false 로 두면 uv 가 자기 자신을 빌드/설치하지 않고 의존성만 관리한다.
[tool.uv]
package = false

# CI 의 테스트 게이트에서만 쓰는 의존성.
# Dockerfile 은 uv sync --no-dev 라 이미지에 들어가지 않는다.
[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
# main.py 가 리포지토리 루트에 있으므로 sys.path 에 넣어준다.
pythonpath = ["."]
